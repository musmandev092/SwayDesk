# Portal dialogs (file chooser, print, Open With): floating and centred
for_window [app_id="^xdg-desktop-portal-(gtk|gnome)$"] floating enable, move position center

# Portal file chooser opens taller than the screen; print and Open With keep their own size
for_window [app_id="^xdg-desktop-portal-(gtk|gnome)$" title="^(?!.*Print)(?!Open With)"] resize set width 60 ppt height 70 ppt, move position center

# In-app file choosers (Open, Save As, Select Copy Destination...) open too small
for_window [floating title="^(?!Open With)(Open|Save|Select|Choose|Pick)( .*)?$"] resize set width 60 ppt height 70 ppt, move position center

# Archive Manager "Extract" started from the file manager has no parent window and would tile
for_window [app_id="^org\.gnome\.FileRoller$" title="^Extract$"] floating enable, resize set width 60 ppt height 70 ppt, move position center

# Keyring password prompt
for_window [app_id="^gcr-prompter$"] floating enable, move position center
