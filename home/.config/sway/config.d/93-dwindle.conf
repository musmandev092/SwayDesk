# Dwindle tiling (DMS plugin "Dwindle"): new windows split the last focused one, like Hyprland.
bindsym --no-warn $mod+t nop dwindle tabs
bindsym --no-warn $mod+Shift+t nop dwindle toggle

# Left hand W/A/S/D: workspaces up and down, windows back and forward in reading order
bindsym --no-warn $mod+w workspace prev
bindsym --no-warn $mod+s workspace next
bindsym --no-warn $mod+a nop dwindle focus prev
bindsym --no-warn $mod+d nop dwindle focus next
bindsym --no-warn $mod+Shift+a nop dwindle swap prev
bindsym --no-warn $mod+Shift+d nop dwindle swap next
bindsym --no-warn $mod+Ctrl+w move container to workspace prev, workspace prev
bindsym --no-warn $mod+Ctrl+s move container to workspace next, workspace next
