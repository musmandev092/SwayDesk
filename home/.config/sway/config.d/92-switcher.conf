# Windows 11 style switcher (DMS plugin "Switcher", home/.config/dms/plugins/Switcher).
# The plugin reacts to these `nop` bindings through Sway's IPC events; while it is open it holds the keyboard.
#   Alt+Tab        windows of this workspace, most recent first; keep Alt down, Tab / arrows move, release Alt to switch
#   Super+Tab      every workspace; type to search, arrows move, Enter or a click switches
#   Del closes the selected window, Esc cancels, the mouse wheel moves, a middle click closes.

bindsym Mod1+Tab nop switcher open windows
bindsym Mod1+Shift+Tab nop switcher open windows prev
bindsym $mod+Tab nop switcher open overview
bindsym $mod+Shift+Tab nop switcher open overview prev

# Super+/ : every shortcut (Fedora spin + DMS + yours). Type to search, Up/Down + Enter or a click runs it, Esc closes.
bindsym --no-warn $mod+slash nop switcher open keys
