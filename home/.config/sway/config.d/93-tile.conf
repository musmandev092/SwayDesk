# Master-stack tiling (swaydesk-tile): new windows join the stack; a layout changed by hand stays
# until Super+Shift+T re-tiles the workspace.
exec sh -c '[ -x "$HOME/.local/bin/swaydesk-tile" ] && exec "$HOME/.local/bin/swaydesk-tile" || exec swaydesk-tile'
# A new window goes to the end of the stack before it is first drawn (the tiler keeps this mark).
for_window [tiling workspace=__focused__] move container to mark _swaydesk_tail
bindsym --no-warn $mod+t nop tile monocle
bindsym --no-warn $mod+Shift+t nop tile retile
bindsym --no-warn $mod+Shift+Return nop tile zoom

# Left hand W/A/S/D: workspaces up and down, windows back and forward in reading order
bindsym --no-warn $mod+w workspace prev
bindsym --no-warn $mod+s workspace next
bindsym --no-warn $mod+a nop tile focus prev
bindsym --no-warn $mod+d nop tile focus next
bindsym --no-warn $mod+Shift+a nop tile swap prev
bindsym --no-warn $mod+Shift+d nop tile swap next
bindsym --no-warn $mod+Ctrl+w move container to workspace prev, workspace prev
bindsym --no-warn $mod+Ctrl+s move container to workspace next, workspace next
