text
firstboot --disable
selinux --enforcing
firewall --enabled

%include /tmp/swaydesk/ks-machine.cfg

%pre --interpreter=/usr/bin/bash --erroronfail --log=/tmp/ks-pre.log
for d in /usr/share/swaydesk-setup /run/install/repo/SwayDesk/install/tui; do
    [ -f "$d/swaydesk-setup" ] && exec bash "$d/swaydesk-setup" --preset=dualboot
done
dev=$(blkid -L Fedora-E-dvd-x86_64-45 2>/dev/null)
mkdir -p /run/swaydesk-iso
[ -n "$dev" ] && mount -o ro "$dev" /run/swaydesk-iso && exec bash /run/swaydesk-iso/SwayDesk/install/tui/swaydesk-setup --preset=dualboot
echo "swaydesk-setup not found on the install media"
exit 1
%end

%packages --exclude-weakdeps --retries=10 --timeout=60
@core
kernel
kernel-modules-extra
grub2-efi-x64
shim-x64
grub2-tools
efibootmgr
os-prober
cryptsetup
btrfs-progs
glibc-langpack-en
NetworkManager-wifi
systemd-pam
rpmfusion-free-release
rpmfusion-nonfree-release

linux-firmware
iwlwifi-mvm-firmware
intel-gpu-firmware
intel-audio-firmware
alsa-sof-firmware
microcode_ctl

mesa-dri-drivers
mesa-vulkan-drivers
intel-media-driver

pipewire
pipewire-pulseaudio
pipewire-alsa
wireplumber
alsa-ucm

bluez
bolt
iio-sensor-proxy
tuned-ppd
upower
fwupd

cups
system-config-printer

sway
sway-config-minimal
sway-systemd
grim
grimshot
slurp
brightnessctl
pulseaudio-utils
polkit
xdg-desktop-portal-wlr
xorg-x11-server-Xwayland
dms
matugen
dux-search
qt6-qtmultimedia
greetd
dux-greeter
xdg-desktop-portal-gnome
gnome-keyring
gnome-keyring-pam

nautilus
sushi
gvfs
gvfs-mtp
gvfs-smb
gvfs-fuse
glycin-thumbnailer
gst-thumbnailers
udisks2
dosfstools
exfatprogs
ntfs-3g
file-roller
papers
loupe
gnome-text-editor
ptyxis
gnome-calculator
snapshot
gnome-clocks
gnome-font-viewer
gnome-disk-utility
showtime
seahorse
gnome-characters
adw-gtk3-theme
xdg-user-dirs
wl-clipboard
swappy

google-noto-sans-vf-fonts
google-noto-serif-vf-fonts
google-noto-sans-mono-vf-fonts
google-noto-nastaliq-urdu-fonts
google-noto-sans-arabic-vf-fonts
google-noto-naskh-arabic-vf-fonts
google-noto-sans-cjk-fonts
google-noto-serif-cjk-fonts
google-noto-sans-devanagari-vf-fonts
google-noto-sans-bengali-vf-fonts
google-noto-sans-gurmukhi-vf-fonts
google-noto-sans-thai-vf-fonts
google-noto-color-emoji-fonts
adwaita-sans-fonts
adwaita-mono-fonts

fastfetch
tar
rsync
git-core
brave-origin
%include /tmp/swaydesk/ks-packages.cfg
%end

%post --nochroot --interpreter=/usr/bin/bash --log=/mnt/sysroot/root/ks-post-nochroot.log
set -x
S=/mnt/sysroot
T=/tmp/swaydesk
install -m 600 "$T/choices.env" "$S/root/swaydesk-choices.env"
install -m 600 "$T/swaydesk-config.json" "$S/root/swaydesk-config.json"
. "$T/choices.env"
if [ "$NETCOPY" = 1 ]; then
    for f in /etc/NetworkManager/system-connections/*.nmconnection; do
        [ -f "$f" ] && install -m 600 "$f" "$S/etc/NetworkManager/system-connections/"
    done
fi
u=$ADMIN
src=""
for m in /run/install/repo /run/install/sources/* /run/install/isodir /run/swaydesk-iso; do
    [ -d "$m/SwayDesk" ] && { src="$m/SwayDesk"; break; }
done
if [ -z "$src" ]; then
    dev=$(blkid -L Fedora-E-dvd-x86_64-45 2>/dev/null || true)
    mkdir -p /mnt/msiso
    [ -n "$dev" ] && mount -o ro "$dev" /mnt/msiso && [ -d /mnt/msiso/SwayDesk ] && src=/mnt/msiso/SwayDesk
fi
if [ -n "$src" ]; then
    mkdir -p "$S/home/$u/Projects" && cp -a "$src" "$S/home/$u/Projects/SwayDesk"
    # Media built on another filesystem can carry world-writable modes.
    chmod -R go-w "$S/home/$u/Projects/SwayDesk"
    echo "SwayDesk copied from $src"
else
    echo "WARNING: SwayDesk not found on the install media"
fi
mountpoint -q /mnt/msiso && umount /mnt/msiso
for f in "$S/root/anaconda-ks.cfg" "$S/root/original-ks.cfg"; do
    [ -f "$f" ] && sed -i '/--passphrase/d' "$f"
done
rm -f "$T/ks-machine.cfg"
%end

%post --interpreter=/usr/bin/bash --log=/root/ks-post.log
set -x
. /root/swaydesk-choices.env

cat > /etc/yum.repos.d/brave-browser.repo <<'EOF'
[brave-browser]
name=Brave Browser
baseurl=https://brave-browser-rpm-release.s3.brave.com/$basearch
enabled=1
gpgcheck=1
gpgkey=https://brave-browser-rpm-release.s3.brave.com/brave-core.asc
EOF

for c in dms dux-repo; do
cat > "/etc/yum.repos.d/_copr:copr.fedorainfracloud.org:duxlabs:$c.repo" <<EOF
[copr:copr.fedorainfracloud.org:duxlabs:$c]
name=Copr repo for $c owned by duxlabs
baseurl=https://download.copr.fedorainfracloud.org/results/duxlabs/$c/fedora-\$releasever-\$basearch/
type=rpm-md
gpgcheck=1
gpgkey=https://download.copr.fedorainfracloud.org/results/duxlabs/$c/pubkey.gpg
repo_gpgcheck=0
enabled=1
enabled_metadata=1
EOF
done

rpm --import /etc/pki/rpm-gpg/RPM-GPG-KEY-rpmfusion-*-fedora-45 || true
for k in https://brave-browser-rpm-release.s3.brave.com/brave-core.asc \
         https://download.copr.fedorainfracloud.org/results/duxlabs/dms/pubkey.gpg \
         https://download.copr.fedorainfracloud.org/results/duxlabs/dux-repo/pubkey.gpg \
         https://musmandev092.github.io/claude-desktop-rpm/RPM-GPG-KEY-claude-desktop-rpm.asc; do
    rpm --import "$k" || echo "WARNING: could not import $k"
done

DMS_OWN="quickshell,dux-search,dux-gop,matugen"
mkdir -p /etc/dnf/repos.override.d
cat > /etc/dnf/repos.override.d/50-dms-copr.repo <<EOF
[fedora]
excludepkgs=$DMS_OWN
[updates]
excludepkgs=$DMS_OWN
[updates-testing]
excludepkgs=$DMS_OWN
EOF
[ "$TESTING" = 1 ] && printf '[updates-testing]\nenabled=1\n' > /etc/dnf/repos.override.d/60-swaydesk-testing.repo
dnf -y --setopt=allow_vendor_change=True --setopt=install_weak_deps=False upgrade ${DMS_OWN//,/ }

dnf -y --setopt=install_weak_deps=False upgrade --refresh
if [ -n "$EXTRA_PKGS" ]; then
    dnf -y --setopt=install_weak_deps=False install $EXTRA_PKGS || echo "WARNING: could not install: $EXTRA_PKGS"
fi

dms-greeter enable || true
systemctl enable greetd.service
systemctl set-default graphical.target
sed -i -e 's/--command niri/--command sway/' -e 's# -C /etc/greetd/niri/config.kdl##' /etc/greetd/config.toml

sed -i '/^GRUB_DISABLE_OS_PROBER=/d' /etc/default/grub
if [ "$OS_PROBER" = 1 ]; then echo 'GRUB_DISABLE_OS_PROBER=false'; else echo 'GRUB_DISABLE_OS_PROBER=true'; fi >> /etc/default/grub
grub2-mkconfig -o /boot/grub2/grub.cfg
grep -i -m1 "menuentry 'Windows" /boot/grub2/grub.cfg || echo "note: no Windows found by os-prober"

mkdir -p /boot/grub2/fonts
grub2-mkfont -s 48 -o /boot/grub2/fonts/adwaita-mono-48.pf2 \
  /usr/share/fonts/adwaita-mono-fonts/AdwaitaMono-Regular.ttf || true

if [ -n "$XKB_VARIANT$XKB_OPTIONS" ] || [ "$XKB_LAYOUT" != us ]; then
    mkdir -p /etc/sway/config.d
    {
        echo 'input type:keyboard {'
        echo "    xkb_layout $XKB_LAYOUT"
        [ -n "$XKB_VARIANT" ] && echo "    xkb_variant $XKB_VARIANT"
        [ -n "$XKB_OPTIONS" ] && echo "    xkb_options $XKB_OPTIONS"
        echo '}'
    } > /etc/sway/config.d/10-keyboard.conf
fi
case $ZRAM in
    zram-half) printf '[zram0]\nzram-size = ram / 2\n' > /etc/systemd/zram-generator.conf ;;
    zram-full) printf '[zram0]\nzram-size = ram\n' > /etc/systemd/zram-generator.conf ;;
esac

u=$ADMIN
M=/home/$u/Projects/SwayDesk
if [ -n "$u" ] && [ -x "$M/apply.sh" ]; then
    if [ "$LEAN" = 1 ]; then touch "$M/.lean"; else rm -f "$M/.lean"; fi
    if [ "$SSHD" = 1 ]; then touch "$M/.sshd"; else rm -f "$M/.sshd"; fi
    chown -R "$u:$u" "/home/$u/Projects"
    SWAYDESK_NVIDIA=$NVIDIA "$M/apply.sh" system
    unit=/home/$u/.config/systemd/user
    mkdir -p "$unit/default.target.wants"
    install -m 0644 "$M/install/swaydesk-firstrun.service" "$unit/"
    ln -sf ../swaydesk-firstrun.service "$unit/default.target.wants/swaydesk-firstrun.service"
    dv=$(rpm -q --qf '%{VERSION}' dms | grep -oE '^[0-9]+\.[0-9]+') || dv=""
    [ -n "$dv" ] && mkdir -p "/home/$u/.config/dms" && echo "$dv" > "/home/$u/.config/dms/.changelog-$dv"
    chown -R "$u:$u" "/home/$u/.config"
else
    echo "WARNING: no SwayDesk for '$u': run apply.sh by hand after first login"
fi

if [ "$FONT" = large ] && [ -f /usr/lib/kbd/consolefonts/latarcyrheb-sun32.psfu.gz ]; then
    sed -i '/^FONT=/d' /etc/vconsole.conf 2>/dev/null; echo 'FONT=latarcyrheb-sun32' >> /etc/vconsole.conf
fi

echo "SwayDesk install finished: $(date -Is)" > /root/ks-done
%end
